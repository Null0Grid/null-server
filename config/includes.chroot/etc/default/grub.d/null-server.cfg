# Null Server GRUB defaults (installed systems). The build hook fills in
# the serial port for the architecture (ttyS0 on amd64, ttyAMA0 on arm64).
GRUB_DISTRIBUTOR="Null Server"
GRUB_TIMEOUT=3
GRUB_CMDLINE_LINUX_DEFAULT="quiet"
GRUB_CMDLINE_LINUX="console=@SERIAL@,115200 console=tty0"
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="black/light-cyan"
