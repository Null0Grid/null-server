# Null Server SSH defaults. null-install turns PasswordAuthentication off
# when you give it a key; `null-ssh passwords off` does the same later.
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 120
ClientAliveCountMax 3
X11Forwarding no
AllowAgentForwarding yes
UseDNS no
# Let an SSH client from Null OS keep the Null mark in the prompt and
# truecolor: ssh -o SendEnv=NULL_GLYPH -o SendEnv=COLORTERM (or SendEnv in
# ~/.ssh/config). Without them the prompt falls back to @ and 256 colours.
AcceptEnv LANG LC_* COLORTERM NULL_GLYPH
