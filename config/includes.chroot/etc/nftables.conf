#!/usr/sbin/nft -f
# Null Server firewall. Incoming is blocked except the ports in
# /etc/nftables.d/null-ports.nft; change those with `null-fw` (or edit the
# file and run `sudo nft -f /etc/nftables.conf`).
#
# forward is left open on purpose: Docker, Podman, libvirt and WireGuard
# manage their own forwarding rules and a drop here would silently break
# them. Make it `policy drop` yourself if this box never routes.

flush ruleset

table inet null {
  include "/etc/nftables.d/null-ports.nft"

  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # Pings, path MTU, neighbour discovery: a server that drops these is
    # the one that breaks in odd ways
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    # DHCPv6 client replies
    ip6 daddr fe80::/64 udp dport 546 accept

    # Brute-force brake: more than 10 new SSH connections a minute from
    # one address get dropped (a real admin never comes near that)
    tcp dport 22 ct state new meter ssh_brake { ip saddr limit rate over 10/minute burst 10 packets } counter drop
    tcp dport 22 ct state new meter ssh_brake6 { ip6 saddr limit rate over 10/minute burst 10 packets } counter drop

    tcp dport @tcp_open accept
    udp dport @udp_open accept

    iif != "lo" ip saddr 127.0.0.0/8 drop
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
